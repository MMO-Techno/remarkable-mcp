name: MCP Interface Conformance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - uses: SamMorrowDrums/mcp-server-diff@40d992e0a220e5b63378758f9a40d6a8982898d2 # v3.0.0
        with:
          install_command: uv sync --frozen
          start_command: uv run python server.py
          server_timeout: "30"
          fail_on_diff: "false"
          # Keep the probe hermetic: registration never reaches a real account.
          env_vars: |
            REMARKABLE_TOKEN={}
